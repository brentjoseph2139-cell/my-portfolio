<style>
:root{--bg:#000;--bg2:#030a1a;--blue:#1e90ff;--blue2:#0a5cff;--cyan:#3ff2ff;--text:#bcd8ff;--dim:#4f78a8;--card:rgba(4,14,34,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000}}
:root[data-theme="dark"]{--bg:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Orbitron","Segoe UI","Trebuchet MS",Verdana,sans-serif;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(30,144,255,.35),transparent 70%),radial-gradient(ellipse 60% 30% at 50% 100%,rgba(10,92,255,.25),transparent 70%),
linear-gradient(rgba(30,144,255,.07) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(30,144,255,.07) 1px,transparent 1px) 0 0/40px 40px,var(--bg2)}
body::after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 22px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border:1px solid rgba(30,144,255,.55);border-radius:8px;
background:linear-gradient(180deg,rgba(40,120,255,.28),rgba(4,14,34,.85) 50%,rgba(2,8,22,.9));box-shadow:0 0 24px rgba(30,144,255,.35),inset 0 1px 0 rgba(255,255,255,.25);position:relative}
h1{margin:0;font-size:26px;letter-spacing:6px;font-weight:700;color:#fff;text-shadow:0 0 6px var(--blue),0 0 18px var(--blue2),0 2px 0 #052a6b}
h1 span{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
.sub{font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:4px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{font-size:10px;letter-spacing:2px;color:var(--text);text-decoration:none;padding:7px 12px;border:1px solid rgba(30,144,255,.4);border-radius:4px;
background:linear-gradient(180deg,rgba(80,160,255,.3),rgba(10,40,100,.4) 50%,rgba(2,10,30,.6) 51%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
nav a.on,nav a:hover,nav a:focus-visible{color:#fff;border-color:var(--cyan);box-shadow:0 0 12px rgba(63,242,255,.6),inset 0 1px 0 rgba(255,255,255,.4);outline:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 14px;font-size:10px;letter-spacing:2px;color:var(--dim)}
.bar .led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-right:8px;animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:18px}
.card{position:relative;aspect-ratio:4/3;border:1px solid rgba(30,144,255,.7);border-radius:7px;padding:8px;background:var(--card);
box-shadow:0 0 14px rgba(30,144,255,.35),inset 0 0 18px rgba(30,144,255,.12);cursor:default;transition:box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover,.card:focus-visible{border-color:var(--cyan);box-shadow:0 0 26px rgba(63,242,255,.55),0 0 6px rgba(30,144,255,.8),inset 0 0 18px rgba(63,242,255,.15);outline:none}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan);filter:drop-shadow(0 0 4px var(--cyan));pointer-events:none}
.card::before{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:7px 0 0 0}
.card::after{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 7px 0}
.img{position:relative;flex:1;min-height:0;border-radius:4px;overflow:hidden;border:1px solid rgba(63,242,255,.25);box-shadow:0 0 12px rgba(30,144,255,.45);
background:radial-gradient(circle at var(--x,50%) var(--y,60%),rgba(30,144,255,.55),transparent 60%),linear-gradient(135deg,#02122e,#041c4a 50%,#010714)}
.img::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(63,242,255,.08) 11px 12px),repeating-linear-gradient(0deg,transparent 0 11px,rgba(63,242,255,.08) 11px 12px)}
.img svg{position:absolute;inset:0;width:100%;height:100%}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.02));pointer-events:none;border-radius:4px 4px 60% 60%/4px 4px 14px 14px}
.meta{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 0;font-size:8px;letter-spacing:2px;color:var(--dim)}
.meta b{color:var(--cyan);font-weight:400;text-shadow:0 0 6px var(--cyan)}
.meta i{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);display:inline-block}
footer{margin-top:22px;padding-top:12px;border-top:1px solid rgba(30,144,255,.4);display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;color:var(--dim);position:relative}
footer::before{content:"";position:absolute;top:-2px;left:0;width:90px;height:3px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}h1{font-size:19px;letter-spacing:4px}header{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){.bar .led{animation:none}}
.card{cursor:pointer}
.lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,4,14,.92);padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.lb.open{display:flex}
.lb img{max-width:min(92vw,1100px);max-height:80vh;object-fit:contain;border:1px solid var(--cyan);border-radius:6px;box-shadow:0 0 32px rgba(63,242,255,.55),0 0 80px rgba(30,144,255,.4);background:#000}
.lb button{position:absolute;font:inherit;color:#fff;cursor:pointer;border:1px solid rgba(63,242,255,.7);border-radius:4px;background:linear-gradient(180deg,rgba(80,160,255,.35),rgba(10,40,100,.5) 50%,rgba(2,10,30,.7) 51%);box-shadow:0 0 12px rgba(63,242,255,.4),inset 0 1px 0 rgba(255,255,255,.3)}
.lb button:hover,.lb button:focus-visible{border-color:var(--cyan);box-shadow:0 0 18px rgba(63,242,255,.8);outline:none}
.lb .nx,.lb .pv{top:50%;transform:translateY(-50%);width:44px;height:64px;font-size:22px}
.lb .pv{left:max(12px,env(safe-area-inset-left,0px))}.lb .nx{right:max(12px,env(safe-area-inset-right,0px))}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:44px;height:36px;font-size:14px;letter-spacing:1px}
.lb .ct{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10px;letter-spacing:3px;color:var(--dim)}
.lb .ct b{color:var(--cyan);font-weight:400}
</style>

var g=document.getElementById('grid');
function setImg(card,src){
  var box=card.querySelector('.img');
  var old=box.querySelector('img');if(old)old.remove();
  var im=new Image();im.src=src;im.alt='';
  box.insertBefore(im,box.querySelector('svg').nextSibling);
  box.querySelector('svg').style.display='none';
}
for(var i=0;i<12;i++){
  var n=('0'+(i+1)).slice(-2),k=i%4;
  var shapes=[
   '<circle cx="50" cy="40" r="22" fill="none" stroke="#3ff2ff" stroke-width=".8"/><circle cx="50" cy="40" r="12" fill="none" stroke="#1e90ff" stroke-width="1.5"/><path d="M50 10V70M20 40H80" stroke="#3ff2ff" stroke-width=".4"/>',
   '<path d="M10 62 L30 38 L45 50 L65 22 L90 54" fill="none" stroke="#3ff2ff" stroke-width="1.2"/><path d="M10 70H90" stroke="#1e90ff" stroke-width=".6"/>',
   '<polygon points="50,14 78,30 78,52 50,68 22,52 22,30" fill="none" stroke="#3ff2ff" stroke-width="1"/><polygon points="50,26 66,35 66,48 50,56 34,48 34,35" fill="rgba(30,144,255,.4)" stroke="#1e90ff"/>',
   '<path d="M14 20H40V34H66V48H86M14 60H30V46H52" fill="none" stroke="#3ff2ff" stroke-width=".9"/><circle cx="86" cy="48" r="2.5" fill="#3ff2ff"/><circle cx="52" cy="46" r="2.5" fill="#3ff2ff"/>'
  ];
  var c=document.createElement('div');
  c.className='card';c.tabIndex=0;
  c.innerHTML='<div class="img" style="--x:'+(25+(i*17)%55)+'%;--y:'+(35+(i*23)%40)+'%"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid slice">'+shapes[k]+'</svg></div>'+
   '<div class="meta"><span>IMG_<b>'+n+'</b></span><span>'+(1024+i*64)+'PX</span><i></i></div>';
  g.appendChild(c);
  setImg(c,IMGS[i]);
}

var lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbc=document.getElementById('lbc'),cur=0,lastCard=null;
function show(n){cur=(n+IMGS.length)%IMGS.length;lbi.src=IMGS[cur];lbc.innerHTML='IMG_<b>'+('0'+(cur+1)).slice(-2)+'</b> &nbsp;/&nbsp; '+IMGS.length;}
function openLb(n){lastCard=document.activeElement;show(n);lb.classList.add('open');lb.querySelector('.x').focus();}
function closeLb(){lb.classList.remove('open');if(lastCard&&lastCard.focus)lastCard.focus();}
Array.prototype.forEach.call(g.children,function(card,idx){
  card.addEventListener('click',function(){openLb(idx);});
  card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openLb(idx);}});
});
lb.querySelector('.x').addEventListener('click',closeLb);
lb.querySelector('.pv').addEventListener('click',function(){show(cur-1);});
lb.querySelector('.nx').addEventListener('click',function(){show(cur+1);});
lb.addEventListener('click',function(e){if(e.target===lb)closeLb();});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(cur-1);}
  else if(e.key==='Escape'){closeLb();}
});
var tx=null;
lb.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',function(e){if(tx===null)return;var d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50)show(cur+(d<0?1:-1));});
</script>
